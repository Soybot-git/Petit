<section id="home" class="home-section">
  <img src="assets/logo-no-background.png" alt="Logo Petit" class="home-logo">

  <div class="text-blob">
    <p [innerHTML]="homeText.text"></p>
  </div>

  <nav class="home-nav" aria-label="Navigazione principale">
    <button class="cta-button" (click)="scrollToSection('contacts')" aria-label="Vai alla sezione Contatti per richiedere informazioni">
      <span>Richiedi informazioni</span>
    </button>
  </nav>
</section>

<div
  class="modal-overlay"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'modal-title-' + title()"
>
  <div class="modal-panel">
    <button
      class="modal-close"
      (click)="onClose()"
      aria-label="Chiudi modale"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <h2 [id]="'modal-title-' + title()" class="modal-title">{{ title() }}</h2>
    <p class="modal-text">{{ text() }}</p>
  </div>
</div>
